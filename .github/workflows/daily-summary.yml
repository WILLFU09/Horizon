name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 20:00 UTC is 04:00 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-summary.yml'

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes
      pages: write     # Needed to enable/configure GitHub Pages
      id-token: write  # Needed by actions/configure-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Preflight - check required secrets
        id: preflight
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          missing=""
          : > preflight.txt
          for name in DEEPSEEK_API_KEY HORIZON_WEBHOOK_URL; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "$name: MISSING" | tee -a preflight.txt
              echo "::error::$name is not set in repository secrets"
              missing="$missing $name"
            else
              echo "$name: present (${#value} chars)" | tee -a preflight.txt
            fi
          done
          if [ -n "$missing" ]; then
            echo "Preflight failed:$missing"
            exit 1
          fi
          echo "All required secrets are present."

      - name: Run Horizon
        id: horizon
        continue-on-error: true
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your data/config.github.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          set -o pipefail
          uv run horizon --hours 24 2>&1 | tee horizon-run.log

      - name: Report failure details
        if: failure() || steps.horizon.outcome == 'failure'
        run: |
          {
            echo "### Run failed"
            echo ""
            echo "| Step | Outcome |"
            echo "| --- | --- |"
            echo "| Preflight | ${{ steps.preflight.outcome }} |"
            echo "| Run Horizon | ${{ steps.horizon.outcome }} |"
            echo ""
            echo '```'
            cat preflight.txt 2>/dev/null || true
            tail -n 60 horizon-run.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the tail of the log as check-run annotations, which are
          # readable without authentication via the check-runs API.
          if [ -f horizon-run.log ]; then
            tail -n 8 horizon-run.log | while IFS= read -r line; do
              echo "::error title=Horizon log::$line"
            done
          fi

      - name: Fail job if Horizon failed
        if: steps.horizon.outcome == 'failure'
        run: exit 1

      - name: Enable Pages via configure-pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Point Pages at the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "--- PUT source=gh-pages ---"
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f "source[branch]=gh-pages" -f "source[path]=/" -f "build_type=legacy" 2>&1 || true
          echo "--- current state ---"
          gh api "repos/${{ github.repository }}/pages" 2>&1 || true

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
